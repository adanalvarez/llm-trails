name: Deploy site to GitHub Pages

# Serves the site from the website/ folder, with data/ copied in alongside index.html,
# so the page can fetch data/viz_data.json. Set Pages source to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths: ['website/**', 'data/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (website/ + data/)
        run: |
          mkdir -p _site
          cp -r website/. _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
