[project]
name = "llmtrials"
version = "0.1.0"
description = "Reproducible single-turn trials: same prompts, many LLMs, N repetitions, full provenance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Harness SDKs pinned exactly: each bundles its CLI (Claude Code 2.1.286 / Codex 0.160.1),
    # which is part of the experimental condition. Upgrade deliberately and note it in the study.
    "claude-agent-sdk==0.2.163",
    "httpx>=0.27",
    "openai-codex==0.160.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
llmtrials = "llmtrials.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmtrials"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
