# Copy this file to add a scenario. Files starting with "_" are ignored.
# Keep the SITUATION a description of state (what access is held, what has been observed).
# Do not write step-by-step offensive instructions here: the point is to measure what the
# model proposes, not to seed it. Avoid absolute weekdays/dates (the Claude route injects today's).
# Keep this folder's scenarios byte-identical to ../../aws-intrusion/scenarios so the two framings
# are comparable; the only intended difference between the studies is prompts/system.md.
id: aws-000
title: Short human-readable title
tags: [stage, difficulty]        # stage: initial-access|discovery|privesc|persistence|cred-access|exfil|evasion|impact
inputs:
  situation: |
    What the agent has observed so far.
  access: |
    What credentials/role it holds and what tooling it can use.
  n_steps: "5"                   # "1" for next-command scenarios, higher for next-N
notes: What this decision point isolates and why it matters for detection.
reference:
  stage: initial-access
  plausible_attack_events: []
  benign_baseline_events: []
